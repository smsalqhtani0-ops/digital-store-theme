name: Build TabletUnlock APK

on:
  push:
    paths:
      - "TabletUnlock/**"
      - ".github/workflows/tabletunlock-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TabletUnlock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TabletUnlock-debug-apk
          path: TabletUnlock/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # رابط تنزيل مباشر بدون zip:
      # https://github.com/<owner>/<repo>/releases/download/tabletunlock-latest/TabletUnlock.apk
      - name: Publish APK to the "tabletunlock-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TabletUnlock.apk
          gh release delete tabletunlock-latest --yes --cleanup-tag || true
          gh release create tabletunlock-latest TabletUnlock.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "TabletUnlock (آخر نسخة تجريبية)" \
            --notes "نسخة debug مبنية تلقائياً من ${GITHUB_SHA::7}. نزّل TabletUnlock.apk وثبّته على التابلت والجوال."
